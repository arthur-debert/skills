# Prettier and markdownlint run against the whole tree, not staged files
# only: a staged-only pass can miss unstaged edits. The docs warner is
# staged-diff by design (it reports on what the commit adds).

pre-commit:
  commands:
    docs-warner:
      priority: 1
      run: .agents/hooks/pre-commit
    prettier:
      priority: 2
      run: |
        if git ls-files -z "*.md" "*.json" "*.yml" "*.yaml" | xargs -0 prettier --check; then
          exit 0
        fi
        echo
        echo "── what prettier would change (printWidth 80, proseWrap: always) ──"
        git ls-files -z "*.md" "*.json" "*.yml" "*.yaml" |
          xargs -0 prettier --list-different |
          while IFS= read -r f; do
            echo
            prettier "$f" | diff -u "$f" - || true
          done
        exit 1
      fail_text: >-
        Prettier style is printWidth 80 and proseWrap: always (hard-wrap
        markdown at 80; wrapped list items indent to the text, not four spaces).
        The diff is in the command output. Run prettier --write on the listed
        files and stage the result.
    markdownlint:
      priority: 3
      run: git ls-files -z "*.md" | xargs -0 markdownlint
      fail_text:
        "Fix the markdownlint findings, or run prettier --write and restage."
